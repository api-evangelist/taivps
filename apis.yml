aid: taivps
name: TaiVPS
image: https://taivps.net/assets/images/anhbia.jpg
description: TaiVPS (taivps.net) is a Vietnamese hosting provider selling Cloud VPS,
  VMware Windows/Linux VPS, web hosting, reseller hosting and domain names. It publishes
  a Vietnamese-language API reference (taivps.net/api-docs) describing token-authenticated
  POST endpoints under https://taivps.net/api/ for listing products and OS images,
  buying, upgrading, reinstalling and controlling VPS instances, and reading account
  balance.
